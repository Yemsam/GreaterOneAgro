<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Login - Wealth Hub Tech</title>
  <meta name="robots" content="noindex, follow">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #081326; color: #e8edf5; }
    .wrap { min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
    .card { width: min(520px, 100%); border: 1px solid rgba(201,150,26,.25); background: #0f2040; padding: 1.4rem; }
    h1 { margin: 0 0 .9rem; font-size: 1.2rem; }
    p { color: #8fa3c4; line-height: 1.5; }
    label { display: block; margin: .75rem 0 .3rem; color: #9db0cf; font-size: .85rem; }
    input { width: 100%; padding: .68rem .75rem; border: 1px solid rgba(139,163,196,.25); background: #09172f; color: #e8edf5; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .95rem; }
    button { padding: .62rem .95rem; border: 1px solid rgba(201,150,26,.35); background: rgba(201,150,26,.12); color: #f5d97a; cursor: pointer; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; }
    .secondary { border-color: rgba(139,163,196,.3); color: #9db0cf; background: rgba(139,163,196,.08); }
    #status { margin-top: .8rem; min-height: 1rem; color: #9db0cf; font-size: .9rem; }
    a { color: #f5d97a; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Client Dashboard Login</h1>
      <p>Part 3 starter. Use email/password for testing. Magic link option is included.</p>

      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" />

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="minimum 6 characters" />

      <div class="row">
        <button id="sign-up">Create Account</button>
        <button id="sign-in">Sign In</button>
        <button id="magic-link" class="secondary">Send Magic Link</button>
      </div>

      <div id="status">Configure SUPABASE_URL and SUPABASE_ANON_KEY in this file first.</div>
      <p style="margin-top:1rem;">After login, go to <a href="dashboard.html">dashboard.html</a>.</p>
    </section>
  </main>

  <script>
    const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

    const statusEl = document.getElementById('status');

    function setStatus(message, type) {
      statusEl.textContent = message;
      if (type === 'error') statusEl.style.color = '#fca5a5';
      else if (type === 'success') statusEl.style.color = '#86efac';
      else statusEl.style.color = '#9db0cf';
    }

    if (SUPABASE_URL.includes('YOUR_PROJECT_ID') || SUPABASE_ANON_KEY.includes('YOUR_SUPABASE_ANON_KEY')) {
      setStatus('Set real Supabase URL and anon key in this file.', 'error');
    }

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function getCredentials() {
      return {
        email: (document.getElementById('email').value || '').trim(),
        password: document.getElementById('password').value || ''
      };
    }

    document.getElementById('sign-up').addEventListener('click', async () => {
      const { email, password } = getCredentials();
      if (!email || password.length < 6) {
        setStatus('Enter valid email and password (minimum 6 chars).', 'error');
        return;
      }

      const { error } = await supabase.auth.signUp({ email, password, options: { data: { full_name: email } } });
      if (error) {
        setStatus(error.message, 'error');
        return;
      }
      setStatus('Account created. Check email if confirmation is enabled.', 'success');
    });

    document.getElementById('sign-in').addEventListener('click', async () => {
      const { email, password } = getCredentials();
      if (!email || !password) {
        setStatus('Enter email and password.', 'error');
        return;
      }

      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        setStatus(error.message, 'error');
        return;
      }

      setStatus('Login successful. Redirecting to dashboard...', 'success');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
    });

    document.getElementById('magic-link').addEventListener('click', async () => {
      const { email } = getCredentials();
      if (!email) {
        setStatus('Enter email first.', 'error');
        return;
      }

      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: window.location.origin + '/dashboard.html' }
      });

      if (error) {
        setStatus(error.message, 'error');
        return;
      }

      setStatus('Magic link sent. Check your email.', 'success');
    });
  </script>
</body>
</html>
