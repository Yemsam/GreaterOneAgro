[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/about-us/"
  to = "/about-us.html"
  status = 200

[[redirects]]
  from = "/housing-properties/"
  to = "/housing-properties.html"
  status = 200

[[redirects]]
  from = "/services/"
  to = "/services.html"
  status = 200

[[redirects]]
  from = "/contact/"
  to = "/contact.html"
  status = 200
